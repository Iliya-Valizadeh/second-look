name: Deploy web door to Pages

# Publishes `web/` on pushes to `main` only, never on other branches. This follows
# GitHub's standard "Pages via Actions" pattern.
#
# `enablement: false` on the Setup Pages step below means this workflow never turns
# GitHub Pages on for this repository by itself. Someone with repo admin access
# still has to visit Settings > Pages and set the source to "GitHub Actions" first
# (a later, separate task, once the repo is public). Until that happens, the `check`
# job below finds Pages isn't configured (a 404 from the Pages API) and every later
# job is skipped, not failed — a skipped run doesn't email anyone. Once Pages is on,
# the same push (or the next one) builds and deploys for real.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check whether GitHub Pages is configured for this repo
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages isn't enabled yet for this repo (Settings > Pages > Source: GitHub Actions). Skipping the build and deploy jobs; this is expected until that's set up."
          fi

  build:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install pinned packages
        run: uv sync --locked

      - name: Build the web door (fetch the pinned Pyodide core, build the wheel)
        run: make web-build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Upload the built web/ folder as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: [check, build]
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
