[project]
name = "second-look"
version = "0.1.0"
description = "Finds recurring charges, price rises, duplicates and odd spending in your browser"
readme = "README.md"
license = "MIT"
authors = [{ name = "Iliya Valizadeh" }]
requires-python = ">=3.11"
# The core uses only the Python standard library (ADR 0001), so it has no runtime
# dependencies here. A later task adds matplotlib for the evaluation chart, but that
# script lives outside src/second_look and so is a dev dependency, not a runtime one.
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "textstat>=0.7.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/second_look"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=second_look --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"
# tools/ is copied from ds-project-standard and checked there. `copier update` replaces it.
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
